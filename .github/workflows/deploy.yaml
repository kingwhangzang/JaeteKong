name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/kingwhangzang/jaetekong-backend
  FRONTEND_IMAGE: ghcr.io/kingwhangzang/jaetekong-frontend

jobs:
  build:
    # EC2 t4g(Graviton)와 같은 arm64 러너에서 빌드
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Upload compose and env
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          {
            printf 'DB_PASSWORD=%s\n' "$DB_PASSWORD"
            printf 'BACKEND_IMAGE=%s:%s\n' "$BACKEND_IMAGE" "$GITHUB_SHA"
            printf 'FRONTEND_IMAGE=%s:%s\n' "$FRONTEND_IMAGE" "$GITHUB_SHA"
          } > .env.deploy
          scp -i ~/.ssh/ec2.pem deploy/compose.prod.yaml "ubuntu@$EC2_HOST:jaetekong/compose.yaml"
          scp -i ~/.ssh/ec2.pem .env.deploy "ubuntu@$EC2_HOST:jaetekong/.env"
          rm .env.deploy

      - name: Pull and restart
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -i ~/.ssh/ec2.pem "ubuntu@$EC2_HOST" \
            "echo '$GHCR_TOKEN' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin \
             && cd jaetekong \
             && chmod 600 .env \
             && docker compose pull \
             && docker compose up -d --remove-orphans \
             && docker image prune -f \
             && docker logout ghcr.io"

      - name: Health check
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "http://$EC2_HOST/api/categories" > /dev/null; then
              echo "Deployed: http://$EC2_HOST"
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed" >&2
          exit 1
