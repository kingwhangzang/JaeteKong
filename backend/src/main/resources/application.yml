spring:
  application:
    name: jaetekong-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/moabom}
    username: ${DB_USERNAME:moabom}
    password: ${DB_PASSWORD:moabom-local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:9080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
