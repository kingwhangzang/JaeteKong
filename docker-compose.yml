services:
  postgres:
    image: postgres:16-alpine
    container_name: moabom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: moabom
      POSTGRES_USER: moabom
      POSTGRES_PASSWORD: moabom-local
    ports:
      - "5432:5432"
    volumes:
      - moabom-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moabom -d moabom"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  moabom-postgres-data:
